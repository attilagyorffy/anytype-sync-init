s3Store:
    bucket: %S3_BUCKET%
    indexBucket: %S3_BUCKET%
    maxThreads: 16
    profile: default
    region: %S3_REGION%
    endpoint: %S3_ENDPOINT%
    forcePathStyle: true # 'true' for self-hosted S3 Object Storage

redis:
    isCluster: false
    url: %REDIS_URL%

drpc:
  stream:
    timeoutMilliseconds: 1000
    maxMsgSizeMb: 256

yamux:
    listenAddrs:
        - %ANY_SYNC_FILENODE_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

quic:
    listenAddrs:
        - %ANY_SYNC_FILENODE_QUIC_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10
    # The Tailscale route carries IP packets of at most 1,280 bytes; quic-go's
    # default first packet (1,280 bytes of UDP payload) is 1,308 as IP and is
    # dropped. 1,200 matches what anytype-heart clients use.
    initialPacketSize: 1200

defaultLimit: %ANY_SYNC_FILENODE_DEFAULT_LIMIT%
