mongo:
    connect: %MONGO_CONNECT%/?w=majority
    database: consensus
    logCollection: log

drpc:
  stream:
    timeoutMilliseconds: 1000
    maxMsgSizeMb: 256

yamux:
    listenAddrs:
        - %ANY_SYNC_CONSENSUSNODE_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

quic:
    listenAddrs:
        - %ANY_SYNC_CONSENSUSNODE_QUIC_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10
    # The Tailscale route carries IP packets of at most 1,280 bytes; quic-go's
    # default first packet (1,280 bytes of UDP payload) is 1,308 as IP and is
    # dropped. 1,200 matches what anytype-heart clients use.
    initialPacketSize: 1200
