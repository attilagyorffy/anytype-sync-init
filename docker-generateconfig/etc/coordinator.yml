mongo:
    connect: %MONGO_CONNECT%
    database: coordinator
    log: log
    spaces: spaces

spaceStatus:
    runSeconds: 5
    deletionPeriodDays: 0

drpc:
  stream:
    timeoutMilliseconds: 1000
    maxMsgSizeMb: 256

yamux:
    listenAddrs:
        - %ANY_SYNC_COORDINATOR_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

quic:
    listenAddrs:
        - %ANY_SYNC_COORDINATOR_QUIC_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10
    # The Tailscale route carries IP packets of at most 1,280 bytes; quic-go's
    # default first packet (1,280 bytes of UDP payload) is 1,308 as IP and is
    # dropped. 1,200 matches what anytype-heart clients use.
    initialPacketSize: 1200

defaultLimits:
    spaceMembersRead: %ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SPACE_MEMBERS_READ%
    spaceMembersWrite: %ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SPACE_MEMBERS_WRITE%
    sharedSpacesLimit: %ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SHARED_SPACES_LIMIT%
